[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-feedback"
version = "0.1.0"
description = "Weekly feedback reports for project repositories: git activity, a health rubric, and next steps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
weekly-feedback = "weekly_feedback.cli:main"

[tool.setuptools]
packages = ["weekly_feedback"]
