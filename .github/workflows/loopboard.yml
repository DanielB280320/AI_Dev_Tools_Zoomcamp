# CI/CD for Loopboard (module_02_03_04/AI_system_interview_design).
#
#   backend-tests ─┐
#                  ├─▶ integration-e2e ─▶ deploy ─▶ verify ─▶ record
#   frontend-tests ┘                     (main only)          (dev only)
#
# The two unit-test jobs run in parallel. The compose stack is built once and
# both the integration check (the frontend's API client driven against the
# real server) and the Playwright suite run against it. The deploy job then
# deploys onto that environment's EC2 instance from deploy/loopboard.cfn.yaml
# through SSM, as the narrowly scoped IAM user from
# deploy/github-deploy-user.cfn.yaml, and verify fails the run unless the
# deployed site's /health answers.
#
# Two environments, one image:
#
#   push to main        ─▶ dev   build once, push to ECR, run it
#   Run workflow ▸ prod ─▶ prod  run the image dev last verified; no rebuild
#
# The image is tagged YYYYMMDD-HHMMSS-<git sha> (e.g. 20260813-163457-83242da),
# and the tag is immutable in ECR. Once dev answers /health, `record` writes
# that tag to the SSM parameter /loopboard/dev/deployed-image. A prod dispatch
# reads it and deploys that exact image, so what runs in prod is what was
# tested in dev — and since nothing is built, the tests do not run again.
#
# Prod is never deployed by a push. Reaching it takes a deliberate dispatch,
# and it can only receive an image that went green on dev: its IAM user cannot
# push to ECR at all. Each environment is a separate CloudFormation stack
# with its own instance, database and address, and a separate IAM user whose
# key lives in that GitHub environment — so a dev run holds no prod credential.
#
# One-time setup per environment (deploy/README.md, "CI/CD"): create that
# environment's deploy user key and store it as the AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY secrets *of the matching GitHub environment*.

name: loopboard

on:
  push:
    branches: [main]
    paths:
      - "module_02_03_04/AI_system_interview_design/**"
      - ".github/workflows/loopboard.yml"
  pull_request:
    paths:
      - "module_02_03_04/AI_system_interview_design/**"
      - ".github/workflows/loopboard.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy once the tests pass
        type: choice
        options: [dev, prod]
        default: dev

# A newer push to the same PR or branch makes the older run's result moot. The
# deploy job has its own group below, which never cancels a deploy midway.
concurrency:
  group: loopboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_DIR: module_02_03_04/AI_system_interview_design
  AWS_REGION: us-east-2
  # The environment this run deploys: whatever the dispatch asked for, and dev
  # for a push. Used in the job's `environment:` and `concurrency:` too, which
  # are evaluated before any step runs and so cannot read a step's output.
  TARGET_ENV: ${{ inputs.environment || 'dev' }}
  # dev keeps the original stack name: CloudFormation cannot rename a stack,
  # and recreating it would hand out a new *.cloudfront.net domain — but that
  # domain is the published dev URL, so the stack stays as it is and only its
  # role is renamed.
  DEV_STACK: loopboard
  PROD_STACK: loopboard-prod
  # deploy/ecr.cfn.yaml, shared by both environments.
  ECR_REPOSITORY: loopboard
  # Written by `record` (dev's user), read by a prod deploy (prod's user).
  PROMOTION_PARAMETER: /loopboard/dev/deployed-image

defaults:
  run:
    working-directory: module_02_03_04/AI_system_interview_design

jobs:
  backend-tests:
    name: Backend tests
    # A prod promotion builds nothing, so there is nothing new to test.
    if: inputs.environment != 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_DIR }}/backend/uv.lock

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/backend
        run: uv sync --locked

      - name: pytest
        working-directory: ${{ env.APP_DIR }}/backend
        run: uv run pytest -q

  frontend-tests:
    name: Frontend tests
    # A prod promotion builds nothing, so there is nothing new to test.
    if: inputs.environment != 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm ci

      - name: Type check
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm test

  integration-e2e:
    name: Integration and end-to-end tests
    needs: [backend-tests, frontend-tests]
    if: inputs.environment != 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ env.APP_DIR }}/frontend/package-lock.json
            ${{ env.APP_DIR }}/e2e/package-lock.json

      # The smoke script loads the frontend's TypeScript sources through jiti,
      # and the Playwright container runs the suite from the mounted
      # e2e/node_modules, so both need installing on the host.
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Build and start the stack
        run: $COMPOSE up --build --detach --wait --wait-timeout 300 app

      - name: Integration tests (frontend API client against the API)
        run: node frontend/scripts/smoke-api.mjs

      # E2E_USER: the container writes test-results/ into the bind-mounted e2e/
      # directory, so it runs as the runner's user (1001, not the 1000 default).
      - name: End-to-end tests (Playwright)
        run: E2E_USER="$(id -u):$(id -g)" $COMPOSE run --rm -e CI=true e2e npx playwright test

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ env.APP_DIR }}/e2e/playwright-report
            ${{ env.APP_DIR }}/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    needs: integration-e2e
    # !failure() rather than the implicit success(): on a prod promotion the
    # tests are skipped, and a skipped need would otherwise skip this too.
    if: >-
      !cancelled() && !failure()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The GitHub environment named here is where this run's AWS credentials
    # come from, so a dev run cannot read the prod key. It also shows the live
    # URL on the run and on the repository's Environments page, and is where a
    # required reviewer on prod is configured.
    #
    # These three cannot read `env`, so they repeat the expression that
    # TARGET_ENV holds for the steps.
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ steps.stack.outputs.site_url }}
    # Per environment: a dev deploy and a prod deploy have no reason to wait
    # for each other, and neither is ever cancelled midway.
    concurrency:
      group: loopboard-deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    outputs:
      site_url: ${{ steps.stack.outputs.site_url }}
      environment: ${{ env.TARGET_ENV }}
      image_tag: ${{ steps.image.outputs.tag }}
      commit: ${{ steps.image.outputs.commit }}
    # Only dev checks anything out, to build; the instance fetches the commit
    # itself.
    defaults:
      run:
        working-directory: .
    steps:
      # Which stack and which SSM document this environment deploys. Both are
      # per-environment: the document name carries the suffix its own
      # github-deploy-user stack gave it, and the user's policy allows that
      # one document on that one stack's instance.
      - name: Resolve the target environment
        id: target
        run: |
          case $TARGET_ENV in
            dev)  stack=$DEV_STACK ;;
            prod) stack=$PROD_STACK ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          echo "document=loopboard-redeploy-$TARGET_ENV" >>"$GITHUB_OUTPUT"
          echo "Deploying to $TARGET_ENV (stack $stack)"

      - name: Check the AWS credentials are configured
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [[ -z $KEY_ID ]]; then
            echo "::error::Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY on the '$TARGET_ENV' GitHub environment (deploy/README.md, \"CI/CD\")"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the instance and the public URL
        id: stack
        env:
          APP_STACK: ${{ steps.target.outputs.stack }}
        run: |
          instance_id=$(aws cloudformation describe-stack-resource \
            --stack-name "$APP_STACK" --logical-resource-id Instance \
            --query StackResourceDetail.PhysicalResourceId --output text)
          # The CloudFront URL when the stack has one (HTTPS, and the only way
          # in when the origin is locked to CloudFront), the site URL otherwise.
          site_url=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue | [0]" --output text)
          if [[ -z $site_url || $site_url == None ]]; then
            site_url=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" --output text)
          fi
          echo "instance_id=$instance_id" >>"$GITHUB_OUTPUT"
          echo "site_url=$site_url" >>"$GITHUB_OUTPUT"
          echo "Deploying to $TARGET_ENV instance $instance_id, served at $site_url"

      # ----- dev: build the image once and push it -----
      - uses: actions/checkout@v5
        if: env.TARGET_ENV == 'dev'

      - name: Log in to ECR
        id: ecr
        if: env.TARGET_ENV == 'dev'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: build
        if: env.TARGET_ENV == 'dev'
        working-directory: ${{ env.APP_DIR }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          image="$REGISTRY/$ECR_REPOSITORY:$tag"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$tag" \
            -t "$image" .
          docker push "$image"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          echo "### Built \`$tag\`" >>"$GITHUB_STEP_SUMMARY"

      # ----- prod: take the image dev last verified -----
      - name: Find the image dev is running
        id: promote
        if: env.TARGET_ENV == 'prod'
        run: |
          if ! record=$(aws ssm get-parameter --name "$PROMOTION_PARAMETER" \
              --query Parameter.Value --output text); then
            echo "::error::Nothing to promote: $PROMOTION_PARAMETER is unreadable or absent. A dev deploy writes it once dev passes /health."
            exit 1
          fi
          tag=$(jq -r .tag <<<"$record")
          commit=$(jq -r .commit <<<"$record")
          # The lifecycle policy expires old images; fail here rather than in
          # a pull on the instance halfway through the deploy.
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$tag" --query 'imageDetails[0].imagePushedAt' --output text
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "### Promoting \`$tag\` from dev" >>"$GITHUB_STEP_SUMMARY"

      - name: Image to deploy
        id: image
        env:
          TAG: ${{ steps.build.outputs.tag || steps.promote.outputs.tag }}
          COMMIT: ${{ steps.build.outputs.commit || steps.promote.outputs.commit }}
        run: |
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >>"$GITHUB_OUTPUT"
          echo "Deploying image $TAG (commit $COMMIT) to $TARGET_ENV"

      # Runs this environment's loopboard-redeploy-<env> document from
      # deploy/github-deploy-user.cfn.yaml: it checks out the commit the image
      # was built from (refusing one that is not on main, or one the tag does
      # not name), then runs bootstrap.sh, which pulls that image and starts
      # it. The commands live in the document, not here, so the deploy
      # credentials cannot run anything else on the instance.
      - name: Deploy the image on the instance
        id: send
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          DOCUMENT: ${{ steps.target.outputs.document }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          COMMIT: ${{ steps.image.outputs.commit }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" \
            --comment "loopboard $TARGET_ENV deploy $IMAGE_TAG (run $GITHUB_RUN_ID)" \
            --parameters "commitSha=$COMMIT,imageTag=$IMAGE_TAG" \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"
          echo "SSM command $command_id"

      # `aws ssm wait command-executed` gives up after 100 seconds, and a
      # rebuild takes several minutes, so this polls on its own.
      - name: Wait for the deploy to finish
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          deadline=$((SECONDS + 1800))
          status=Pending
          while (( SECONDS < deadline )); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            echo "$(date -u +%H:%M:%S) $status"
            case $status in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "::group::Instance output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 60
          echo "::endgroup::"

          if [[ $status != Success ]]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -n 60
            echo "::error::Deploy command ended as $status"
            exit 1
          fi

  verify:
    name: Verify ${{ needs.deploy.outputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      # Through the public front door, not from the instance: this is the path
      # a user takes, so it also catches a broken Caddy or CloudFront hop.
      - name: Check /health
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          url="${SITE_URL%/}/health"
          for attempt in $(seq 1 20); do
            if body=$(curl -fsS --max-time 10 "$url") \
              && [[ $(jq -r .status <<<"$body") == ok ]]; then
              echo "$url -> $body"
              exit 0
            fi
            echo "attempt $attempt: $url not healthy yet"
            sleep 15
          done
          echo "::error::$url did not report {\"status\": \"ok\"} within 5 minutes"
          exit 1

  # Marks dev's image as the one a prod dispatch promotes — only now that dev
  # has answered /health with it, so a broken build is never promotable.
  record:
    name: Record dev's image for promotion
    needs: [deploy, verify]
    if: needs.deploy.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # For dev's credentials; only dev's user may write the parameter.
    environment: dev
    concurrency:
      group: loopboard-deploy-dev-record
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write the promotion record
        env:
          TAG: ${{ needs.deploy.outputs.image_tag }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
        run: |
          aws ssm put-parameter --name "$PROMOTION_PARAMETER" --type String --overwrite \
            --value "$(jq -nc --arg tag "$TAG" --arg commit "$COMMIT" '{tag: $tag, commit: $commit}')" \
            >/dev/null
          echo "$PROMOTION_PARAMETER = $TAG ($COMMIT)"
          echo "### \`$TAG\` is now what a prod deploy promotes" >>"$GITHUB_STEP_SUMMARY"
