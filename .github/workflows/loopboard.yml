# CI/CD for Loopboard (module_02_03_04/AI_system_interview_design).
#
#   backend-tests ─┐
#                  ├─▶ integration-e2e ─▶ deploy ─▶ verify
#   frontend-tests ┘                     (main only)
#
# The two unit-test jobs run in parallel. The compose stack is built once and
# both the integration check (the frontend's API client driven against the
# real server) and the Playwright suite run against it. The deploy job then
# redeploys the tested commit onto that environment's EC2 instance from
# deploy/loopboard.cfn.yaml through SSM, as the narrowly scoped IAM user from
# deploy/github-deploy-user.cfn.yaml, and the last job fails the run unless the
# deployed site's /health answers.
#
# Two environments, one pipeline:
#
#   push to main      ─▶ dev    (automatic)
#   Run workflow ▸ prod ─▶ prod (manual dispatch only)
#
# Prod is never deployed by a push. Reaching it takes a deliberate dispatch,
# and the tests above still have to pass first, so prod only ever receives a
# commit that went green. Each environment is a separate CloudFormation stack
# with its own instance, database and address, and a separate IAM user whose
# key lives in that GitHub environment — so a dev run holds no prod credential.
#
# One-time setup per environment (deploy/README.md, "CI/CD"): create that
# environment's deploy user key and store it as the AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY secrets *of the matching GitHub environment*.

name: loopboard

on:
  push:
    branches: [main]
    paths:
      - "module_02_03_04/AI_system_interview_design/**"
      - ".github/workflows/loopboard.yml"
  pull_request:
    paths:
      - "module_02_03_04/AI_system_interview_design/**"
      - ".github/workflows/loopboard.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy once the tests pass
        type: choice
        options: [dev, prod]
        default: dev

# A newer push to the same PR or branch makes the older run's result moot. The
# deploy job has its own group below, which never cancels a deploy midway.
concurrency:
  group: loopboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_DIR: module_02_03_04/AI_system_interview_design
  AWS_REGION: us-east-2
  # The environment this run deploys: whatever the dispatch asked for, and dev
  # for a push. Used in the job's `environment:` and `concurrency:` too, which
  # are evaluated before any step runs and so cannot read a step's output.
  TARGET_ENV: ${{ inputs.environment || 'dev' }}
  # dev keeps the original stack name: CloudFormation cannot rename a stack,
  # and recreating it would hand out a new *.cloudfront.net domain — but that
  # domain is the published dev URL, so the stack stays as it is and only its
  # role is renamed.
  DEV_STACK: loopboard
  PROD_STACK: loopboard-prod

defaults:
  run:
    working-directory: module_02_03_04/AI_system_interview_design

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_DIR }}/backend/uv.lock

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/backend
        run: uv sync --locked

      - name: pytest
        working-directory: ${{ env.APP_DIR }}/backend
        run: uv run pytest -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm ci

      - name: Type check
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm test

  integration-e2e:
    name: Integration and end-to-end tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ env.APP_DIR }}/frontend/package-lock.json
            ${{ env.APP_DIR }}/e2e/package-lock.json

      # The smoke script loads the frontend's TypeScript sources through jiti,
      # and the Playwright container runs the suite from the mounted
      # e2e/node_modules, so both need installing on the host.
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Build and start the stack
        run: $COMPOSE up --build --detach --wait --wait-timeout 300 app

      - name: Integration tests (frontend API client against the API)
        run: node frontend/scripts/smoke-api.mjs

      # E2E_USER: the container writes test-results/ into the bind-mounted e2e/
      # directory, so it runs as the runner's user (1001, not the 1000 default).
      - name: End-to-end tests (Playwright)
        run: E2E_USER="$(id -u):$(id -g)" $COMPOSE run --rm -e CI=true e2e npx playwright test

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ env.APP_DIR }}/e2e/playwright-report
            ${{ env.APP_DIR }}/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    needs: integration-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The GitHub environment named here is where this run's AWS credentials
    # come from, so a dev run cannot read the prod key. It also shows the live
    # URL on the run and on the repository's Environments page, and is where a
    # required reviewer on prod is configured.
    #
    # These three cannot read `env`, so they repeat the expression that
    # TARGET_ENV holds for the steps.
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ steps.stack.outputs.site_url }}
    # Per environment: a dev deploy and a prod deploy have no reason to wait
    # for each other, and neither is ever cancelled midway.
    concurrency:
      group: loopboard-deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    outputs:
      site_url: ${{ steps.stack.outputs.site_url }}
      environment: ${{ env.TARGET_ENV }}
    # Nothing is checked out here; the instance fetches the commit itself.
    defaults:
      run:
        working-directory: .
    steps:
      # Which stack and which SSM document this environment deploys. Both are
      # per-environment: the document name carries the suffix its own
      # github-deploy-user stack gave it, and the user's policy allows that
      # one document on that one stack's instance.
      - name: Resolve the target environment
        id: target
        run: |
          case $TARGET_ENV in
            dev)  stack=$DEV_STACK ;;
            prod) stack=$PROD_STACK ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          echo "document=loopboard-redeploy-$TARGET_ENV" >>"$GITHUB_OUTPUT"
          echo "Deploying to $TARGET_ENV (stack $stack)"

      - name: Check the AWS credentials are configured
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [[ -z $KEY_ID ]]; then
            echo "::error::Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY on the '$TARGET_ENV' GitHub environment (deploy/README.md, \"CI/CD\")"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the instance and the public URL
        id: stack
        env:
          APP_STACK: ${{ steps.target.outputs.stack }}
        run: |
          instance_id=$(aws cloudformation describe-stack-resource \
            --stack-name "$APP_STACK" --logical-resource-id Instance \
            --query StackResourceDetail.PhysicalResourceId --output text)
          # The CloudFront URL when the stack has one (HTTPS, and the only way
          # in when the origin is locked to CloudFront), the site URL otherwise.
          site_url=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue | [0]" --output text)
          if [[ -z $site_url || $site_url == None ]]; then
            site_url=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" --output text)
          fi
          echo "instance_id=$instance_id" >>"$GITHUB_OUTPUT"
          echo "site_url=$site_url" >>"$GITHUB_OUTPUT"
          echo "Deploying $GITHUB_SHA to $TARGET_ENV instance $instance_id, served at $site_url"

      # Runs this environment's loopboard-redeploy-<env> document from
      # deploy/github-deploy-user.cfn.yaml: it checks out exactly the commit
      # this run tested (refusing one that is not on main), then runs the same
      # idempotent bootstrap.sh a manual redeploy does. The commands live in
      # the document, not here, so the deploy credentials cannot run anything
      # else on the instance.
      - name: Redeploy the tested commit on the instance
        id: send
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          DOCUMENT: ${{ steps.target.outputs.document }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" \
            --comment "loopboard $TARGET_ENV deploy ${GITHUB_SHA::12} (run $GITHUB_RUN_ID)" \
            --parameters "commitSha=$GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"
          echo "SSM command $command_id"

      # `aws ssm wait command-executed` gives up after 100 seconds, and a
      # rebuild takes several minutes, so this polls on its own.
      - name: Wait for the deploy to finish
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          deadline=$((SECONDS + 1800))
          status=Pending
          while (( SECONDS < deadline )); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            echo "$(date -u +%H:%M:%S) $status"
            case $status in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "::group::Instance output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 60
          echo "::endgroup::"

          if [[ $status != Success ]]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -n 60
            echo "::error::Deploy command ended as $status"
            exit 1
          fi

  verify:
    name: Verify ${{ needs.deploy.outputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      # Through the public front door, not from the instance: this is the path
      # a user takes, so it also catches a broken Caddy or CloudFront hop.
      - name: Check /health
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          url="${SITE_URL%/}/health"
          for attempt in $(seq 1 20); do
            if body=$(curl -fsS --max-time 10 "$url") \
              && [[ $(jq -r .status <<<"$body") == ok ]]; then
              echo "$url -> $body"
              exit 0
            fi
            echo "attempt $attempt: $url not healthy yet"
            sleep 15
          done
          echo "::error::$url did not report {\"status\": \"ok\"} within 5 minutes"
          exit 1
