{% extends "feedback/base.html" %}
{% block title %}New project{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>New project</h1>
  <p class="muted small">You'll be the manager, and the only one who can add or remove members.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.name.errors }}
    {{ form.name }}
    <button class="primary" type="submit">Create</button>
  </form>
</div>
{% endblock %}
