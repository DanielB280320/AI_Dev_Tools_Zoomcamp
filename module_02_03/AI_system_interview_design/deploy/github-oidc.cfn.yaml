AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The role GitHub Actions assumes, through OpenID Connect, to redeploy Loopboard:
  no long-lived access key stored in GitHub. It can read the app stack's
  outputs and run the redeploy on that stack's instance through Systems
  Manager, and nothing else.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      The CI/CD workflow (.github/workflows/loopboard.yml at the repository
      root) deploys by sending `bootstrap.sh` to the running instance through
      SSM Run Command, so the role needs no EC2, IAM or CloudFormation write
      access. That keeps a compromised workflow run from doing more than
      redeploying a commit of this repository.
    must:
      - >-
        The trust policy pins both the audience (sts.amazonaws.com) and the
        subject to this repository's `production` environment. A subject
        wildcard such as `repo:*` lets any GitHub repository assume the role.
      - >-
        Creating an IAM identity provider is denied by the project SCPs on the
        Free and Paid plans (`iam:*Provider*`). This stack deploys only once
        advanced features are activated in AWS Settings.

Parameters:
  GitHubRepository:
    Type: String
    Default: DanielB280320/AI_Dev_Tools_Zoomcamp
    AllowedPattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    Description: owner/name of the repository whose workflow may assume the role.

  GitHubEnvironment:
    Type: String
    Default: production
    Description: >-
      The GitHub environment the deploy job runs in. Only jobs in it get a
      token this role accepts, so pull requests and other branches cannot
      deploy even though they run the same workflow.

  AppStackName:
    Type: String
    Default: loopboard
    Description: The stack deploy/loopboard.cfn.yaml created.

  ExistingOidcProviderArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws:iam::\d{12}:oidc-provider/token\.actions\.githubusercontent\.com$
    Description: >-
      An account has at most one provider per URL. If
      token.actions.githubusercontent.com is already registered, pass its ARN
      and the stack reuses it; empty creates it.

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # No ThumbprintList: IAM verifies GitHub's certificate against its own
      # trusted CAs, so a pinned thumbprint would only break when GitHub
      # rotates its certificate.

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "GitHub Actions deploys of ${AppStackName} from ${GitHubRepository}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: redeploy-loopboard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAppStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"

              # CloudFormation tags every instance it creates with its stack's
              # name, so this reaches that stack's instance and no other.
              - Sid: RunOnAppInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/aws:cloudformation:stack-name: !Ref AppStackName

              - Sid: RunShellScriptDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"

              # Neither supports resource-level permissions.
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-deploy"}

Outputs:
  DeployRoleArn:
    Description: >-
      Set as the AWS_DEPLOY_ROLE_ARN variable of the repository's `production`
      environment (Settings > Environments > production > Variables).
    Value: !GetAtt DeployRole.Arn
