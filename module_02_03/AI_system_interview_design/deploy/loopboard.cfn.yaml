AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Loopboard on one EC2 instance: the repository's docker-compose stack (Postgres
  and the app image) behind Caddy, which terminates TLS with an automatically
  renewed Let's Encrypt certificate. One instance on purpose — the app's SSE
  broker is per-process, so a second one would serve clients that never hear
  about the first one's edits.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      The deployable form of a stack that is already tested as docker-compose
      (`make e2e`), so the thing deployed stays the thing tested. The instance
      builds the images from the public repository at boot, which keeps the
      template self-contained: no registry, no build pipeline, no artifact to
      upload before a deploy.
    must:
      - >-
        Exactly one app process. `backend/app/events.py` keeps its SSE
        subscribers in a process-local dict, so horizontal scaling silently
        breaks live collaboration until that fan-out moves to Postgres
        LISTEN/NOTIFY or Redis.
      - >-
        The database password is generated on the instance, never passed as a
        stack parameter — parameter values are readable through the
        CloudFormation API for as long as the stack exists.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcId, SubnetId]
      - Label: {default: Instance}
        Parameters: [InstanceType, LatestAmiId, SshAllowedCidr]
      - Label: {default: Site}
        Parameters: [DomainName, LetsEncryptEmail, HostedZoneId, SeedDemoData]
      - Label: {default: Source}
        Parameters: [RepoUrl, RepoBranch, AppPath]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance. The default VPC is the usual answer.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A public subnet in that VPC — one whose route table has an internet
      gateway, since the instance both serves the public and pulls its own
      images at boot.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large, t4g.small, t4g.medium]
    Description: >-
      t3.small (2 GiB) is enough; the bootstrap adds swap so the frontend build
      does not run out of memory. Pick a t4g.* only with an arm64 AMI.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Resolved from the SSM public parameter, so a fresh deployment gets a
      current Amazon Linux 2023 image rather than a hardcoded stale one.

  SshAllowedCidr:
    Type: String
    Default: ""
    AllowedPattern: ^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: >-
      CIDR allowed to reach port 22, e.g. 203.0.113.4/32. Empty (the default)
      opens no SSH at all — the instance profile below allows Session Manager,
      which needs no open port and no key pair.

  DomainName:
    Type: String
    Default: ""
    Description: >-
      The name the site is served as, e.g. loopboard.example.com. Caddy obtains
      a certificate for it once its DNS record points at this stack's Elastic
      IP. Empty serves plain HTTP on the IP.

  LetsEncryptEmail:
    Type: String
    Default: ""
    Description: Where Let's Encrypt sends certificate-expiry warnings. Optional.

  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Optional Route 53 hosted zone holding DomainName; given both, the stack
      creates the A record itself. Leave empty when DNS lives elsewhere.

  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Put a CloudFront distribution in front of the instance, which serves the
      app over HTTPS on a *.cloudfront.net name without owning a domain. Read
      the note on the Distribution resource before turning this on for a
      collaborative session: it proxies the SSE stream.

  CloudFrontOriginPrefixListId:
    Type: String
    Default: ""
    AllowedPattern: ^$|^pl-[0-9a-f]+$
    Description: >-
      AWS's com.amazonaws.global.cloudfront.origin-facing managed prefix list
      for this Region (pl-b6a144df in us-east-2). Given it, and with
      EnableCloudFront true, the instance accepts HTTP only from CloudFront's
      edge, so the distribution becomes the only way in and nobody can reach
      the app over plain HTTP by its address. Empty leaves it open.

  SeedDemoData:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to seed the demo interviewers, who share one published password.
      False on a public address; POST /auth/register makes a real account.

  RepoUrl:
    Type: String
    Default: https://github.com/DanielB280320/AI_Dev_Tools_Zoomcamp.git
    Description: Public repository the instance clones at boot.

  RepoBranch:
    Type: String
    Default: main

  AppPath:
    Type: String
    Default: module_02_03/AI_system_interview_design
    Description: Path to the app within that repository.

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  LockOriginToCloudFront: !And
    - !Equals [!Ref EnableCloudFront, "true"]
    - !Not [!Equals [!Ref CloudFrontOriginPrefixListId, ""]]
  HasSsh: !Not [!Equals [!Ref SshAllowedCidr, ""]]
  HasDnsRecord: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref DomainName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Two shapes, one per front door. Served directly, the instance is a
          public web server and must be open: Let's Encrypt's HTTP-01
          challenge arrives on port 80 from addresses that cannot be
          enumerated. Behind CloudFront, only the edge should reach it, or the
          HTTPS the distribution provides is bypassable by using the address.
        must:
          - SSH stays closed unless SshAllowedCidr names a specific address.
          - >-
            Locking the origin to CloudFront and obtaining a Let's Encrypt
            certificate on the instance are mutually exclusive: the challenge
            cannot reach a port 80 that only CloudFront may open. Use the
            distribution's certificate, or leave the origin open — not both.
    Properties:
      GroupDescription: !Sub "${AWS::StackName}: public HTTP/HTTPS, egress anywhere"
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - LockOriginToCloudFront
        # CloudFront's edge only. 443 is here so switching the origin to
        # https-only later needs no security-group change; no UDP, because
        # CloudFront does not speak HTTP/3 to an origin.
        - - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontOriginPrefixListId, Description: "HTTP from CloudFront edge locations only"}
          - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: !Ref CloudFrontOriginPrefixListId, Description: "HTTPS from CloudFront edge locations only"}
        - - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP, and the ACME HTTP-01 challenge"}
          - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
          - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTP/3 (QUIC)"}
      SecurityGroupEgress:
        - {IpProtocol: -1, CidrIp: 0.0.0.0/0, Description: "Package, image and ACME traffic"}
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-sg"}

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshAllowedCidr
      Description: SSH from the operator's address

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Session Manager only. The instance calls no AWS API of its own — it
          clones from a public repository and pulls public images — so this
          role exists to give shell access without an open SSH port.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-role"}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          A DNS record has to point somewhere stable. An instance's ordinary
          public IP changes on stop/start, which would invalidate both the
          record and the certificate that depends on it resolving.
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-eip"}

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One instance running docker-compose, which is the same stack the e2e
          suite drives locally. UserData clones the repository and hands off to
          deploy/bootstrap.sh, so redeploying is a git pull and a re-run rather
          than a stack update.
        must:
          - IMDSv2 only, and the root volume encrypted.
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}"}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Everything below is logged where a failed stack is explained from.
          exec > >(tee /var/log/loopboard-bootstrap.log) 2>&1
          set -x

          WAIT_HANDLE='${BootstrapWaitHandle}'

          # The stack's parameters, as the file bootstrap.sh reads. A quoted
          # heredoc keeps the shell out of it; CloudFormation has already
          # substituted the values.
          install -d -m 700 /etc/loopboard
          cat > /etc/loopboard/deploy.env <<'EOF_ENV'
          DOMAIN_NAME=${DomainName}
          LETSENCRYPT_EMAIL=${LetsEncryptEmail}
          SEED_DEMO_DATA=${SeedDemoData}
          EOF_ENV

          dnf install -y git

          # /opt/loopboard/app is the stable path the docs and the redeploy
          # command use, wherever the app sits inside the repository.
          install -d /opt/loopboard
          if [ -d /opt/loopboard/repo/.git ]; then
            git -C /opt/loopboard/repo pull --ff-only
          else
            git clone --depth 1 --branch ${RepoBranch} ${RepoUrl} /opt/loopboard/repo
          fi
          ln -sfn /opt/loopboard/repo/${AppPath} /opt/loopboard/app

          STATUS=FAILURE
          REASON='bootstrap failed - see /var/log/loopboard-bootstrap.log on the instance'
          if /opt/loopboard/app/deploy/bootstrap.sh; then
            STATUS=SUCCESS
            REASON='loopboard is up'
          fi

          # The signal the stack is waiting on. Written to a file first, so the
          # JSON needs no quoting gymnastics on the curl command line.
          cat > /tmp/signal.json <<EOF_SIGNAL
          {"Status":"${!STATUS}","Reason":"${!REASON}","UniqueId":"bootstrap","Data":"/var/log/loopboard-bootstrap.log"}
          EOF_SIGNAL
          curl -fsS -X PUT -H 'Content-Type:' --data-binary @/tmp/signal.json "${!WAIT_HANDLE}"

  # A wait condition rather than a CreationPolicy on the instance: the signal
  # comes from curl, so nothing depends on the aws-cfn-bootstrap package being
  # present and current on the AMI.
  BootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref BootstrapWaitHandle
      # Clone, two image builds (npm ci and a Vite build among them) and the
      # health checks. Twenty minutes is generous for t3.small; a genuine
      # failure signals immediately rather than waiting this out.
      Timeout: "1500"
      Count: 1

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    # The origin is the instance's AWS-provided hostname, which needs the
    # Elastic IP attached before it resolves to it.
    DependsOn: ElasticIpAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          HTTPS without owning a domain: the distribution serves the app under
          its own *.cloudfront.net certificate, which is the only free way to
          get a browser-trusted certificate for an address nobody registered.
          Let's Encrypt refuses to issue for *.compute.amazonaws.com, so the
          instance cannot obtain one for its own hostname.
        must:
          - >-
            Caching stays disabled and every method is allowed. This is a
            proxy in front of an API, not a CDN in front of assets; a cached
            POST response or a dropped Authorization header breaks the app.
          - >-
            Origin timeouts stay at or above the SSE keepalive
            (LOOPBOARD_SSE_KEEPALIVE_SECONDS, 20 s by default). CloudFront
            closes an origin connection that is silent for OriginReadTimeout,
            and the canvas stream is silent between events by design.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} — HTTPS front door"
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe only; the cheapest class, and this is one
        # instance in Ohio regardless of where the edge is.
        PriceClass: PriceClass_100
        Origins:
          - Id: instance
            # ec2-<dashed elastic ip>.<region>.compute.amazonaws.com — built
            # from the address because CloudFront rejects a bare IP as an
            # origin, and the instance's own attribute is resolved before the
            # Elastic IP is attached.
            DomainName: !Join
              - ""
              - - "ec2-"
                - !Join ["-", !Split [".", !Ref ElasticIp]]
                - "."
                - !Ref AWS::Region
                - ".compute.amazonaws.com"
            CustomOriginConfig:
              # Plain HTTP to the origin: the instance has no certificate, and
              # could not get one for this hostname. TLS ends at the edge.
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginSSLProtocols: [TLSv1.2]
              # 60 s is the ceiling without a quota increase, and three times
              # the SSE keepalive. Below the keepalive, every idle stream dies.
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: instance
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled and Managed-AllViewer: nothing is cached,
          # and every header (Authorization above all), cookie and query
          # string reaches the app.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          # Caddy already compresses, and compressing at the edge as well
          # would buffer the event stream that Caddy deliberately does not.
          Compress: false
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-cdn"}

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  PublicIp:
    Description: The Elastic IP — the address a DNS A record points at.
    Value: !Ref ElasticIp

  SiteUrl:
    Description: Where the app answers.
    Value: !If
      - HasDnsRecord
      - !Sub "https://${DomainName}"
      - !Sub "http://${ElasticIp}"

  DnsInstructions:
    Description: What to do next when DNS is not managed in Route 53.
    Value: !Sub "Point an A record for your domain at ${ElasticIp}; Caddy gets the certificate within a minute of it resolving."

  CloudFrontUrl:
    Condition: UseCloudFront
    Description: HTTPS address served by CloudFront, with no domain of your own.
    Value: !Sub "https://${Distribution.DomainName}"

  OriginExposure:
    Description: Whether the instance is reachable directly, or only through CloudFront.
    Value: !If
      - LockOriginToCloudFront
      - !Sub "Locked: only CloudFront edges may reach ${ElasticIp} on 80/443."
      - !Sub "Open: http://${ElasticIp} is reachable directly and bypasses any CDN."

  ShellCommand:
    Description: A shell on the instance without an open SSH port.
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"

  RedeployCommand:
    Description: Pull the latest commit and rebuild, run on the instance.
    Value: "cd /opt/loopboard/repo && sudo git pull && sudo /opt/loopboard/app/deploy/bootstrap.sh"

  LogCommand:
    Description: Follow the application logs, run on the instance.
    Value: "cd /opt/loopboard/app/deploy && sudo docker compose -f docker-compose.prod.yaml logs -f app"
