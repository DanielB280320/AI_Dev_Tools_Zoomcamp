[project]
name = "loopboard-backend"
version = "0.1.0"
description = "Loopboard API — backend for the AI system design interview platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # starlette's TestClient imports a deprecated anyio alias at module level.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]
