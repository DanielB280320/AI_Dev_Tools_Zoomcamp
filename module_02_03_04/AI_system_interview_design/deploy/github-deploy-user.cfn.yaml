AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The IAM user GitHub Actions deploys Loopboard as. It can read the app stack,
  and run one fixed SSM document on that stack's instance, which redeploys a
  commit that is on main. Nothing else.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      The CI/CD workflow (.github/workflows/loopboard.yml at the repository
      root) deploys by sending `bootstrap.sh` to the running instance through
      SSM Run Command, so it needs no EC2, IAM or CloudFormation write access.
      An IAM user rather than a GitHub OIDC role because the project SCPs deny
      `iam:*Provider*`, and advanced features, which lift that, are not
      available on the Free plan. With the OIDC provider out of reach, a
      long-lived key is the way in, so the permissions stay as narrow as a
      role's would.
    must:
      - >-
        No AWS::IAM::AccessKey here. Its secret would be readable through
        GetAtt and the CloudFormation API for as long as the stack exists;
        create the key with `aws iam create-access-key` and put it straight
        into GitHub secrets.
      - >-
        Rotate the key by creating a second one, updating the GitHub secrets,
        then deleting the first. A user holds at most two keys.
      - >-
        The user runs RedeployDocument and no other document. AWS-RunShellScript
        takes arbitrary commands and runs them as root, so a leaked key would
        be a root shell on the instance; this document takes only a commit
        hash, which it refuses unless the hash is on main.

Parameters:
  AppStackName:
    Type: String
    Default: loopboard
    Description: The stack deploy/loopboard.cfn.yaml created.

  UserName:
    Type: String
    Default: loopboard-github-deploy
    Description: Name of the IAM user, which `aws iam create-access-key` takes.

  DocumentName:
    Type: String
    Default: loopboard-redeploy
    Description: The SSM document the workflow sends. The workflow names it too.

Resources:
  RedeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Ref DocumentName
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Redeploy Loopboard at a commit on the main branch.
        parameters:
          commitSha:
            type: String
            description: Full 40-character commit hash to deploy.
            # SSM validates this before anything runs, so the value that
            # reaches the shell below is hex and nothing else.
            allowedPattern: ^[0-9a-f]{40}$
        mainSteps:
          - action: aws:runShellScript
            name: redeploy
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - set -eu
                - cd /opt/loopboard/repo
                # GitHub serves any commit in the repository's fork network
                # by hash, so a fetched hash alone could be someone's fork.
                # Deploy only what is in main's recent history.
                - git fetch --depth 100 origin main
                - >-
                  git merge-base --is-ancestor {{ commitSha }} FETCH_HEAD
                  || { echo "{{ commitSha }} is not on main" >&2; exit 1; }
                # -B main keeps the checkout on a branch, so the README's
                # manual `git pull` redeploy still works.
                - git checkout --force -B main {{ commitSha }}
                - /opt/loopboard/app/deploy/bootstrap.sh
                - echo "deployed-commit=$(git rev-parse HEAD)"

  DeployUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      # No LoginProfile: this user has an access key and no console password.
      Policies:
        - PolicyName: redeploy-loopboard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAppStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"

              # SendCommand is authorized against the instance and the
              # document separately; both must match. CloudFormation tags every
              # instance it creates with its stack's name, so this reaches that
              # stack's instance and no other. No iam:PassRole and no S3
              # bucket, so a command cannot publish notifications or write its
              # output anywhere.
              - Sid: RunOnAppInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/aws:cloudformation:stack-name: !Ref AppStackName

              - Sid: RunRedeployDocumentOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${RedeployDocument}"

              # Has no resource type, so it cannot be scoped below "*".
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-deploy"}

Outputs:
  RedeployDocumentName:
    Description: The document the workflow's deploy job sends.
    Value: !Ref RedeployDocument

  DeployUserName:
    Description: Create its access key with `aws iam create-access-key --user-name <this>`.
    Value: !Ref DeployUser
