AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The IAM user GitHub Actions deploys one Loopboard environment as. It can read
  that environment's app stack, and run one fixed SSM document on that stack's
  instance, which deploys an image from ECR at a commit that is on main. dev's
  user also pushes that image and records it once dev is verified; prod's user
  reads that record and nothing else from dev. Nothing else.

  Deployed once per environment, like the app stack it serves. The two users are
  separate on purpose: the prod key lives only in the prod GitHub environment,
  so a workflow run that has not been approved for prod holds no credential
  that could reach it.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      The CI/CD workflow (.github/workflows/loopboard.yml at the repository
      root) deploys by sending `bootstrap.sh` to the running instance through
      SSM Run Command, so it needs no EC2, IAM or CloudFormation write access.
      An IAM user rather than a GitHub OIDC role because the project SCPs deny
      `iam:*Provider*`, and advanced features, which lift that, are not
      available on the Free plan. With the OIDC provider out of reach, a
      long-lived key is the way in, so the permissions stay as narrow as a
      role's would.
    must:
      - >-
        No AWS::IAM::AccessKey here. Its secret would be readable through
        GetAtt and the CloudFormation API for as long as the stack exists;
        create the key with `aws iam create-access-key` and put it straight
        into GitHub secrets.
      - >-
        Rotate the key by creating a second one, updating the GitHub secrets,
        then deleting the first. A user holds at most two keys.
      - >-
        The user runs its own RedeployDocument and no other document.
        AWS-RunShellScript takes arbitrary commands and runs them as root, so a
        leaked key would be a root shell on the instance; this document takes
        only a commit hash, which it refuses unless the hash is on main.
      - >-
        One environment per stack. Widening a user to both environments would
        undo the separation above — the dev key would become a prod key.
      - >-
        Prod never builds. Its user has no ECR push permission, so the only
        image it can deploy is one dev's user pushed — the promotion is
        enforced by IAM, not just by the workflow.
      - >-
        AppPath here and in the app stack are the same path. The app stack's
        copy runs once, in UserData at first boot; this one runs on every
        deploy, so this is the one that keeps a moved app working.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: >-
      Which environment this user deploys. It suffixes the user and document
      names, so the two stacks never collide on an account-global IAM or SSM
      name.

  AppStackName:
    Type: String
    Description: >-
      The stack deploy/loopboard.cfn.yaml created for this environment — the
      only stack this user may read, and whose instance tag scopes SendCommand.

  AppPath:
    Type: String
    Default: module_02_03_04/AI_system_interview_design
    Description: >-
      Path to the app within the repository. The document repoints
      /opt/loopboard/app at it on every deploy, so moving the app in the
      repository is this parameter and nothing else — no instance replacement,
      no manual step on the box. Keep it equal to the app stack's AppPath, which
      only takes effect at first boot.

  ImageRepositoryName:
    Type: String
    Default: loopboard
    Description: The ECR repository from deploy/ecr.cfn.yaml.

  PromotionParameterName:
    Type: String
    Default: /loopboard/dev/deployed-image
    Description: >-
      Where dev's last verified image is recorded, as JSON {"tag", "commit"}.
      dev's user writes it once dev answers /health; prod's user reads it to
      know what to promote. Not created here, so a stack update never resets
      it — the first verified dev deploy creates it.

Conditions:
  IsDev: !Equals [!Ref EnvironmentName, dev]
  IsProd: !Equals [!Ref EnvironmentName, prod]

Resources:
  RedeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "loopboard-redeploy-${EnvironmentName}"
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: !Sub "Deploy a Loopboard image from ECR (${EnvironmentName}) at the commit on main it was built from."
        parameters:
          commitSha:
            type: String
            description: Full 40-character commit hash the image was built from.
            # SSM validates this before anything runs, so the value that
            # reaches the shell below is hex and nothing else.
            allowedPattern: ^[0-9a-f]{40}$
          imageTag:
            type: String
            description: Image tag in ECR, YYYYMMDD-HHMMSS-<7-char git sha>.
            allowedPattern: ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$
        mainSteps:
          - action: aws:runShellScript
            name: redeploy
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - set -eu
                - cd /opt/loopboard/repo
                # GitHub serves any commit in the repository's fork network
                # by hash, so a fetched hash alone could be someone's fork.
                # Deploy only what is in main's recent history.
                - git fetch --depth 100 origin main
                - >-
                  git merge-base --is-ancestor {{ commitSha }} FETCH_HEAD
                  || { echo "{{ commitSha }} is not on main" >&2; exit 1; }
                # -B main keeps the checkout on a branch, so the README's
                # manual `git pull` redeploy still works.
                # The image and the compose file and bootstrap.sh that run it
                # come from the same commit, or a promoted image could meet a
                # deploy script from a later one.
                - >-
                  [ "$(printf %.7s {{ commitSha }})" = "$(echo {{ imageTag }} | cut -d- -f3)" ]
                  || { echo "{{ imageTag }} was not built from {{ commitSha }}" >&2; exit 1; }
                - git checkout --force -B main {{ commitSha }}
                # /opt/loopboard/app is the stable path the next line, the
                # README and the stack's outputs all use. UserData created it
                # at first boot, so without this a commit that moves the app
                # within the repository leaves the symlink dangling and the
                # deploy fails on a path that no longer exists.
                - !Sub "ln -sfn /opt/loopboard/repo/${AppPath} /opt/loopboard/app"
                # Same account and Region as this document, and the instance
                # role may pull from this one repository only.
                - !Sub "LOOPBOARD_IMAGE=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepositoryName}:{{ imageTag }} /opt/loopboard/app/deploy/bootstrap.sh"
                - echo "deployed-commit=$(git rev-parse HEAD)"
                - echo "deployed-image={{ imageTag }}"

  DeployUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "loopboard-github-deploy-${EnvironmentName}"
      # No LoginProfile: this user has an access key and no console password.
      Policies:
        - PolicyName: !Sub "redeploy-loopboard-${EnvironmentName}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAppStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"

              # SendCommand is authorized against the instance and the
              # document separately; both must match. CloudFormation tags every
              # instance it creates with its stack's name, so this reaches this
              # environment's instance and not the other environment's. No
              # iam:PassRole and no S3 bucket, so a command cannot publish
              # notifications or write its output anywhere.
              - Sid: RunOnAppInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/aws:cloudformation:stack-name: !Ref AppStackName

              - Sid: RunRedeployDocumentOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${RedeployDocument}"

              # Has no resource type, so it cannot be scoped below "*".
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

              # Registry-wide by design; it grants a login token, and what the
              # token can do is decided by the statements below.
              - !If
                - IsDev
                - Sid: EcrLogin
                  Effect: Allow
                  Action: ecr:GetAuthorizationToken
                  Resource: "*"
                - !Ref AWS::NoValue

              # Dev builds the image, so only dev pushes. Tags are immutable,
              # so a push can add an image but never replace one prod runs.
              - !If
                - IsDev
                - Sid: PushImage
                  Effect: Allow
                  Action:
                    - ecr:BatchCheckLayerAvailability
                    - ecr:InitiateLayerUpload
                    - ecr:UploadLayerPart
                    - ecr:CompleteLayerUpload
                    - ecr:PutImage
                    - ecr:BatchGetImage
                  Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}"
                - !Ref AWS::NoValue

              - !If
                - IsDev
                - Sid: RecordVerifiedImage
                  Effect: Allow
                  Action: ssm:PutParameter
                  Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PromotionParameterName}"
                - !Ref AWS::NoValue

              # Prod reads which image dev verified, and checks it is still in
              # the repository before sending a deploy that would fail to pull.
              - !If
                - IsProd
                - Sid: ReadVerifiedImage
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PromotionParameterName}"
                - !Ref AWS::NoValue

              - !If
                - IsProd
                - Sid: CheckImageExists
                  Effect: Allow
                  Action: ecr:DescribeImages
                  Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}"
                - !Ref AWS::NoValue
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-deploy"}
        - {Key: Environment, Value: !Ref EnvironmentName}

Outputs:
  Environment:
    Description: The environment this user deploys.
    Value: !Ref EnvironmentName

  PromotionParameter:
    Description: dev's last verified image — written by dev's user, read by prod's.
    Value: !Ref PromotionParameterName

  RedeployDocumentName:
    Description: The document the workflow's deploy job sends for this environment.
    Value: !Ref RedeployDocument

  DeployUserName:
    Description: Create its access key with `aws iam create-access-key --user-name <this>`.
    Value: !Ref DeployUser
