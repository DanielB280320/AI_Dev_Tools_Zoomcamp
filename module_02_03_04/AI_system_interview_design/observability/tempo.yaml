# Tempo, single binary (`-target=all`), blocks on local disk under /var/tempo
# (a volume). Traces arrive as OTLP/gRPC from the Collector. Blocks are kept
# for Tempo's default 14 days.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
